:root{--bg:#f5f6f8;--card:#fff;--text:#1f2328;--muted:#667085;--line:#e6e8ec;--accent:#2563eb;}

header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:12px 12px 10px}

.search{display:flex;gap:7px;flex-wrap:wrap}

button{border:1px solid #cfd4dc;background:#fff;border-radius:10px;padding:9px 10px;font-size:13px;cursor:pointer}
button.active{background:#1f2937;color:#fff;border-color:#1f2937}
.filters{display:flex;gap:6px;overflow:auto;margin-top:8px;padding-bottom:2px}
.filters button{white-space:nowrap}
.stats{font-size:12px;color:var(--muted);margin-top:7px}
main{max-width:930px;margin:auto;padding:10px}
.volume-title{font-size:18px;font-weight:900;margin:18px 4px 8px;padding-left:9px;border-left:5px solid var(--accent)}
.part{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.part>summary{cursor:pointer;list-style:none;padding:14px 15px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.part>summary::-webkit-details-marker{display:none}
.count{font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap}
.items{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:37px 1fr 45px;gap:7px;padding:9px 10px;border-bottom:1px solid #f0f1f3;align-items:start}
.item:last-child{border-bottom:0}
.no{font-variant-numeric:tabular-nums;color:#555;font-weight:700}
.page{text-align:right;color:#7a7f87;font-variant-numeric:tabular-nums}
.title{line-height:1.45}
.meta{font-size:12px;margin-top:3px;line-height:1.35}
.s5{color:#b91c1c;font-weight:800} .s4{color:#c2410c;font-weight:700} .s3{color:#92400e;font-weight:700}
.topic{color:#667085;margin-left:5px}
mark{background:#fff1a8;padding:0 2px;border-radius:3px}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 12px 28px}
.legend{background:#fff;border:1px solid var(--line);border-radius:10px;padding:9px 11px;margin:0 0 10px;font-size:13px;line-height:1.55}
@media(max-width:480px){main{padding:7px} h1{font-size:18px} .part>summary{font-size:16px} .item{grid-template-columns:32px 1fr 36px;padding:9px 8px;font-size:14px}}
</style>

const app = document.getElementById('app');
const stats = document.getElementById('stats');
let minStars = 0;

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function starText(n) { return n ? '★'.repeat(n) : ''; }

function render() {
  const f = document.getElementById('q').value.trim().toLowerCase();
  const keepLegend = app.querySelector('.legend');
  app.innerHTML = '';
  if (keepLegend) app.appendChild(keepLegend);
  else {
    const legend=document.createElement('div'); legend.className='legend';
    legend.innerHTML='<b>사용법</b> · ★★★★★ = 먼저 답안작성까지 · ★★★★ = 목차+핵심 인출 · ★★★ = 1차 구조 학습<br>별점이 없는 항목은 중요하지 않다는 뜻이 아니라, 이번 4개 모의고사 분석에서 TOP50 주제에 직접 연결되지 않은 항목입니다.';
    app.appendChild(legend);
  }

  let shown=0;
  ["상권","하권"].forEach(vol => {
    const vp = parts.filter(p=>p.volume===vol);
    let hasVol = false;
    const container = document.createDocumentFragment();

    vp.forEach((p,pi)=>{
      const matches = p.items.filter(x => {
        const text=(x[0]+' '+x[1]+' '+x[2]+' '+p.title+' '+(x[4]||'')).toLowerCase();
        const starOk = minStars===0 ? true : (minStars===1 ? x[3]>0 : x[3]>=minStars);
        return starOk && (!f || text.includes(f));
      });
      if(!matches.length) return;
      if(!hasVol) {
        const vh=document.createElement('div'); vh.className='volume-title'; vh.textContent=vol; container.appendChild(vh); hasVol=true;
      }
      shown += matches.length;
      const d=document.createElement('details'); d.className='part'; d.open=!!f || minStars>=3;
      const s=document.createElement('summary');
      s.innerHTML=`<span>${esc(p.part)} · ${esc(p.title)}</span><span class="count">${matches.length}개</span>`;
      d.appendChild(s);
      const wrap=document.createElement('div'); wrap.className='items';
      matches.forEach(x=>{
        const row=document.createElement('div'); row.className='item';
        let title=esc(x[1]);
        if(f){
          const idx=x[1].toLowerCase().indexOf(f);
          if(idx>=0) title=esc(x[1].slice(0,idx))+'<mark>'+esc(x[1].slice(idx,idx+f.length))+'</mark>'+esc(x[1].slice(idx+f.length));
        }
        const cls=x[3]===5?'s5':x[3]===4?'s4':x[3]===3?'s3':'';
        const meta=x[3]?`<div class="meta ${cls}">${starText(x[3])}<span class="topic">${esc(x[4])}</span></div>`:'';
        row.innerHTML=`<div class="no">${x[0]}</div><div class="title">${title}${meta}</div><div class="page">${x[2]}</div>`;
        wrap.appendChild(row);
      });
      d.appendChild(wrap); container.appendChild(d);
    });
    app.appendChild(container);
  });

  const total=parts.reduce((a,p)=>a+p.items.length,0);
  stats.textContent = `표시 ${shown}개 / 전체 ${total}개`;
}

document.getElementById('q').addEventListener('input',render);
document.getElementById('openAll').onclick=()=>document.querySelectorAll('.part').forEach(x=>x.open=true);
document.getElementById('closeAll').onclick=()=>document.querySelectorAll('.part').forEach(x=>x.open=false);
document.querySelectorAll('.filter').forEach(btn=>btn.onclick=()=>{
  document.querySelectorAll('.filter').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
  minStars=Number(btn.dataset.min);
  render();
});
render();
</script>
