<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>소방기술사 목차</title>
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#2563eb">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
:root{--bg:#f5f6f8;--card:#fff;--text:#1f2328;--muted:#667085;--line:#e6e8ec;--accent:#2563eb;}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR","Segoe UI",Arial,sans-serif;}
header{position:sticky;top:0;z-index:10;background:rgba(255,255,255,.97);backdrop-filter:blur(8px);border-bottom:1px solid var(--line);padding:13px 14px 11px}
h1{font-size:20px;margin:0 0 7px} .sub{font-size:12px;color:var(--muted);margin-bottom:9px}
.search{display:flex;gap:7px;flex-wrap:wrap}
input[type=search]{flex:1;min-width:210px;font-size:16px;padding:10px 12px;border:1px solid #cfd4dc;border-radius:10px;background:#fff}
button{border:1px solid #cfd4dc;background:#fff;border-radius:10px;padding:9px 11px;font-size:13px}
main{max-width:920px;margin:auto;padding:11px}
.volume-title{font-size:18px;font-weight:900;margin:18px 4px 8px;padding-left:9px;border-left:5px solid var(--accent)}
.part{background:var(--card);border:1px solid var(--line);border-radius:13px;margin-bottom:10px;overflow:hidden}
.part>summary{cursor:pointer;list-style:none;padding:14px 15px;font-weight:800;font-size:17px;display:flex;justify-content:space-between;gap:10px}
.part>summary::-webkit-details-marker{display:none}
.count{font-weight:500;font-size:12px;color:var(--muted);white-space:nowrap}
.items{border-top:1px solid var(--line)}
.item{display:grid;grid-template-columns:39px 1fr 42px;gap:7px;padding:9px 12px;border-bottom:1px solid #f0f1f3;align-items:start}
.item:last-child{border-bottom:0}
.no{font-variant-numeric:tabular-nums;color:#555;font-weight:700}
.page{text-align:right;color:#7a7f87;font-variant-numeric:tabular-nums}
.title{line-height:1.45} mark{background:#fff1a8;padding:0 2px;border-radius:3px}
.stats{font-size:12px;color:var(--muted);margin:5px 1px 0}
.footer{color:var(--muted);font-size:12px;text-align:center;padding:18px 12px 28px}
@media (max-width:480px){main{padding:8px} h1{font-size:19px} .part>summary{font-size:16px} .item{grid-template-columns:34px 1fr 38px;padding:9px 9px;font-size:14px}}
</style>
</head>
<body>
<header>
  <h1>🔥 필휴 소방기술사 상·하권 전체 목차</h1>
  <div class="sub">상권 PART 01~05 + 하권 PART 01~03 · 검색 / 접기·펼치기</div>
  <div class="search">
    <input id="q" type="search" placeholder="예: 수격현상, 플래시오버, RTI, 화재조사">
    <button id="openAll">전체 펼침</button>
    <button id="closeAll">전체 접기</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<main id="app"></main>
<div class="footer">제공된 상·하권 목차 이미지를 바탕으로 정리한 학습용 HTML</div>

const app = document.getElementById('app');
const stats = document.getElementById('stats');

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}
function render(filter='') {
  const f = filter.trim().toLowerCase();
  app.innerHTML = '';
  let shown=0;
  ["상권","하권"].forEach(vol => {
    const vp = parts.filter(p=>p.volume===vol);
    const usable = vp.map(p=>({...p, matches:p.items.filter(x=>!f || (x[0]+' '+x[1]+' '+x[2]+' '+p.title).toLowerCase().includes(f))}))
                     .filter(p=>!f || p.matches.length);
    if(!usable.length) return;
    const vh=document.createElement('div'); vh.className='volume-title'; vh.textContent=vol; app.appendChild(vh);
    usable.forEach((p,pi)=>{
      shown += p.matches.length;
      const d=document.createElement('details'); d.className='part'; d.open=!!f || (vol==="상권" && pi===0);
      const s=document.createElement('summary');
      s.innerHTML=`<span>${esc(p.part)} · ${esc(p.title)}</span><span class="count">${p.matches.length}개</span>`;
      d.appendChild(s);
      const wrap=document.createElement('div'); wrap.className='items';
      p.matches.forEach(x=>{
        const row=document.createElement('div'); row.className='item';
        let title=esc(x[1]);
        if(f){
          const idx=x[1].toLowerCase().indexOf(f);
          if(idx>=0) title=esc(x[1].slice(0,idx))+'<mark>'+esc(x[1].slice(idx,idx+f.length))+'</mark>'+esc(x[1].slice(idx+f.length));
        }
        row.innerHTML=`<div class="no">${x[0]}</div><div class="title">${title}</div><div class="page">${x[2]}</div>`;
        wrap.appendChild(row);
      });
      d.appendChild(wrap); app.appendChild(d);
    });
  });
  const total=parts.reduce((a,p)=>a+p.items.length,0);
  stats.textContent = f ? `검색 결과 ${shown}개 / 전체 ${total}개` : `전체 목차 ${total}개`;
}
render();
document.getElementById('q').addEventListener('input',e=>render(e.target.value));
