          if(idx&gt;=0) title=esc(x[1].slice(0,idx))+'&lt;mark&gt;'+esc(x[1].slice(idx,idx+f.length))+'&lt;/mark&gt;'+esc(x[1].slice(idx+f.length));
        }
        const cls=x[3]===5?'s5':x[3]===4?'s4':x[3]===3?'s3':'';
        const meta=x[3]?`&lt;div class=&quot;meta ${cls}&quot;&gt;${starText(x[3])}&lt;span class=&quot;topic&quot;&gt;${esc(x[4])}&lt;/span&gt;&lt;/div&gt;`:'';
        row.innerHTML=`&lt;div class=&quot;no&quot;&gt;${x[0]}&lt;/div&gt;&lt;div class=&quot;title&quot;&gt;${title}${meta}&lt;/div&gt;&lt;div class=&quot;page&quot;&gt;${x[2]}&lt;/div&gt;`;
        wrap.appendChild(row);
      });
      d.appendChild(wrap); container.appendChild(d);
    });
    app.appendChild(container);
  });

  const total=parts.reduce((a,p)=&gt;a+p.items.length,0);
  stats.textContent = `표시 ${shown}개 / 전체 ${total}개`;
}

&lt;div class=&quot;qwrap&quot;&gt;&lt;div class=&quot;qhead actual-head&quot;&gt;실제시험 기출 2문제&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[133-3-3]&lt;/b&gt; 소방설비의 수계소화설비등에 적용되는 감압방식에 대하여 다음을 설명하시오. 1) 감압이 필요한 이유 2) 감압방식의 종류 및 특징 3) 감압방식 중 일반적으로 많이 사용하는 방식의 경우 설치 방법 4) 「소방시설등 성능위주설계 평가 운영 표준 가이드라인」에서 소방용 감압밸브의 성능시험 3가지&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[119-4-2]&lt;/b&gt; NFPA 20에 따라 소방펌프 및 충압펌프 기동·정지압력을 세팅하려고 한다. 아래 내용에 대하여 설명하시오. 1) 소방펌프 및 충압펌프 기동·정지압력 설정 기준 2) 소방펌프의 최소운전시간 3) 소방펌프의 운전범위 4) 소방펌프(전동기 구동 1대, 디젤엔진 구동 2대) 및 충압펌프의 정격압력은 150 psi, 체절압력은 165 psi이다. 현재 정격압력 기준 자동기동, 자동정지로 셋팅된 상태를 체절압력 기준 자동기동, 수동 정지 상태로 변경하려고 한다. 소방펌프 및 충압펌프의 기동·정지 압력 세팅값을 계산하시오. (단, 최소 정적 급수압력은 50 psi으로 한다) 5) 계통 신뢰성 향상을 위한 고려사항&lt;/div&gt;&lt;div class=&quot;qhead mock-head&quot;&gt;모의고사 1문제&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-1-4-2-3]&lt;/b&gt;&lt;span class=&quot;mock-ref&quot;&gt; · 74, 78, 104, 105, 106, 122, 129, 133회 기출변형&lt;/span&gt; 소방설비의 수계소화설비 등에 적용되는 감압방식에 대하여 다음을 설명하시오. , , 802 1) 감압이 필요한 이유 2) 감압방식의 종류 및 특징 3) 감압방식 중 일반적으로 많이 사용하는 방식의 경우 설치방법 4) 배관용 감압밸브의 압력 Setting 절차&lt;/div&gt;&lt;/div&gt;&lt;/details&gt;&lt;div class=&quot;volume&quot; data-volume=&quot;하권&quot;&gt;하권 · PART 01 소방기계Ⅱ&lt;/div&gt;&lt;details class=&quot;toc-item&quot; data-search=&quot;스프링클러 소화특성 ESFR·RTI·ADD·RDD&quot; data-stars=&quot;5&quot; id=&quot;toc-107&quot;&gt;

&lt;div class=&quot;qwrap&quot;&gt;&lt;div class=&quot;qhead actual-head&quot;&gt;실제시험 기출 1문제&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[116-3-6]&lt;/b&gt; 단일 구획에 설치된 스프링클러소화설비의 헤드 열적 반응과 살수 냉각 효과를 조사하기 위하여 Zone 모델(FAST) 화재프로그램을 사용하여 아래와 같이 5가지 화재시나리오에 대하여 화재시뮬레이션을 각각 수행할 경우 화재시뮬레이션 결과의 열방출률-시간 곡선의 그림을 도시하고 헤드의 소화성능을 반응시간지수(RTI) 값과 살수밀도 ρ 값을 고려하여 비교·설명하시오. (단, 구획 크기는 4 m×4 m×3 m, 화재성장계수 α=medium(=0.012 ㎾/s2), 최대 열방출률 max =1055 ㎾이고, 쇠퇴기는 성장기와 같다. 화재시뮬레이션 결과 시나리오 2(S2)의 경우 헤드작동시간 ta=135 s, 화재진압시간 t=700 s이다.) 시나리오 반응시간지수 RTI[(m·s)1/2] 살수밀도 ρ[m3/s·m2] 헤드작동온도 Ta[℃] S1 No sprinkler No sprinkler No sprinkler S2 100 0.0001017 74 S3 260 0.0001017 74 S4 50 0.0002033 74 S5 100 0.0002033 74&lt;/div&gt;&lt;div class=&quot;qhead mock-head&quot;&gt;모의고사 2문제&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-5-8-2-3]&lt;/b&gt; 스프링클러 헤드와 관련하여 다음 사항을 설명하시오.
1) 다음 RTI(반응시간지수) 공식을 증명하시오.
\[
RTI=\frac{-t_{op}\sqrt{U}}{\ln\left(1-\frac{\Delta T_e}{\Delta T_g}\right)}
\]
여기서 \(t_{op}\): 감열체 작동시간(s), \(U\): 열기류 속도(m/s),
\(\Delta T_e\): 감열체 작동온도와 초기온도의 차이,
\(\Delta T_g\): 열기류 온도와 감열체 초기온도의 차이.
2) KS B ISO 6182-1에 규정된 열전도계수 \(C\) 산출방법

&lt;div class=&quot;qwrap&quot;&gt;&lt;div class=&quot;qhead actual-head&quot;&gt;실제시험 기출 15문제&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[139-1-8]&lt;/b&gt; 고정식 포소화설비의 방출기구 중 하나인 고정포 방출구(Ⅱ형)의 다음 사항에 대하여 설명하시오. 1) 베이퍼 실(Vapor seal)의 설치목적 2) 베이퍼 실의 재질 3) 고정포 방출구(Ⅱ형)의 점검사항&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[135-1-3]&lt;/b&gt; 「국가화재안전기술기준(NFTC 105)」에서 제시하는 압축공기포소화설비의 성능에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[134-3-5]&lt;/b&gt; 포 소화설비에 대하여 다음을 설명하시오. 1) 소화원리 2) 기계포(공기포) 소화약제 종류별 장·단점 3) 「포소화설비의 화재안전성능기준(NFPC 105)」에서 포 소화약제 저장탱크 설치기준 4) 「포소화설비의 화재안전성능기준(NFPC 105)」에서 전역방출방식 항공기 격납고의 고발포용 고정포 방출구 방출량&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[132-4-5]&lt;/b&gt; 포소화설비에서 팽창비의 측정방법과 고정포방출구에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[131-3-3]&lt;/b&gt; 옥외 탱크저장소의 포소화설비 설치와 관련하여 다음에 대하여 설명하시오. 1) 위험물 탱크의 구조에 따라 적용하는 고정포방출구의 종류 2) 고정포방출구의 종류별 정의와 특징&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[130-3-5]&lt;/b&gt; 다음 소방설비에 대하여 설명하시오. (1) 하향식피난구 성능기준 (2) 교차회로방식과 송배전방식 (3) 대형소화기의 소화약제량(물, 강화액, 할로겐화합물, 이산화탄소, 분말, 포소화기) (4) 고가수조, 압력수조, 가압수조 (5) 미분무 정의와 사용압력에 따른 미분무소화설비 분류&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[129-4-5]&lt;/b&gt; NFPA 11(포소화설비)에서 포소화설비가 적절하게 설치되었는가를 판단하기 위해 필요한 인수시험(세정 포함), 압력시험, 작동시험, 방출시험 절차에 대하여 각각 설명 하시오.&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[127-1-3]&lt;/b&gt; 위험물의 옥외 취급시설에 적용되는 고정식 포소화설비의 포방출구를 포모니터노즐 (Foam Monitor Nozzle) 방식으로 적용할 경우 다음사항을 설명하시오. 1) 포모니터노즐의 정의 2) 설치 기준 3) 수원의 수량&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[125-2-1]&lt;/b&gt; 포소화약제 공기포 혼합장치의 종류별 특징에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[121-4-1]&lt;/b&gt; 공기포 소화약제의 혼합 방식에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[110-1-7]&lt;/b&gt; 포소화설비의 혼합장치 중 압축공기포 믹싱챔버방식에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[108-3-4]&lt;/b&gt; 위험물을 옥외에서 제조취급하는 화학공장 시설에 설치되는 고정식 포소화설비의 포방출구를 포모니터 노즐 방식으로 설치하고자 할 경우 다음 사항을 설명하시오. 1) 포모니터 노즐의 정의 2) 설치기준 3) 수원의 수량&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[107-3-6]&lt;/b&gt; 위험물 저장탱크에서 화재가 발생하였을 경우 다음 질문에 답하시오 1) 위험물이 아세톤일 경우 사용 가능한 알콜형 포소화약제를 5가지로 세분하여 그 특성을 설명하 시오. 2) 위험물이 중유일 경우 저장 탱크에서 나타날 수 있는 슬롭오버 (Slop Over) 와 보일오버 (Boil Over) 현상에 대하여 설명하시오&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[103-4-6]&lt;/b&gt; 아래와 같은 위험물 옥외탱크 저장소에 포소화설비와 물분무소화설비를 설치하고자 한다. 다음 물음에 답하시오.(단, 한 개 탱크의 화재경우를 기준으로 하고, 화재탱크 및 인접탱크도 탱크 측면 전체에 물분무소화설비를 적용한다.)&lt;/div&gt;&lt;div class=&quot;question actual&quot;&gt;&lt;b&gt;[102-1-9]&lt;/b&gt; 포소화설비에서 표면하주입식을 적용할 수 없는 경우에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;qhead mock-head&quot;&gt;모의고사 13문제&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-5-10-1-10]&lt;/b&gt; 옥외저장탱크에 포소화설비를 적용할 경우 표면 주입방식과 표면하 주입방식의 특징 을 비교 설명하시오.&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-5-10-1-7]&lt;/b&gt; 위험물안전관리법령의 소화설비, 경보설비 및 피난설비의 기준에서 규정하는 물분무 소화설비 및 포소화설비 설치기준을 설명하시오.&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-5-7-2-2]&lt;/b&gt;&lt;span class=&quot;mock-ref&quot;&gt; · 134, 135회 기출변형&lt;/span&gt; 포 소화설비에 대해여 다음을 설명하시오. , , 156, 192 1) 소화원리 2) 기계포(공기포) 소화약제 종류별 장·단점 3) 「포소화설비의 화재안전기술기준(NFTC 105)」에서 제시하는 압축공기포소화설비의 성능&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-1-12-2-5]&lt;/b&gt;&lt;span class=&quot;mock-ref&quot;&gt; · 132회 기출변형&lt;/span&gt; 포소화설비에서 팽창비 및 25% 환원시간 측정방법과 고정포방출구에 대하여 설명하시 오. , , 183, 185, 192&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-1-10-1-7]&lt;/b&gt; 포소화설비의 화재안전기술기준(NFTC 105)과 NFPA 11의 전역방출방식 포 방출량 산정방법 차이에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모26-1-9-1-9]&lt;/b&gt; 포소화설비의 약제혼합장치 중에서 Line Proportioner Type과 Pressure Proportioner Type에 대하여 설명하시오.&lt;/div&gt;&lt;div class=&quot;question mock&quot;&gt;&lt;b&gt;[모25-9-13-2-6]&lt;/b&gt;&lt;span class=&quot;mock-ref&quot;&gt; · 103회 기출&lt;/span&gt; 아래와 같은 위험물 옥외탱크 저장소에 포소화설비와 물분무소화설비를 설치하고자 한다. 다음 물음에 답하시오.
